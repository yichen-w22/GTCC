[project]
name = "gtcc-online"
version = "0.1.0"
description = "Online GTCC energy analysis service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.118.0",
    "iapws>=1.5.4",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyfluids>=2.8.2",
    "python-dotenv>=1.1.1",
    "python-json-logger>=4.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "uvicorn>=0.37.0",
]

[tool.uv]
package = false
